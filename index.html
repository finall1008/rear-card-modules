<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>背屏卡片桥 · 模块目录</title>
  <meta name="description" content="背屏卡片桥的可下载 API 2 模块目录。下载 ZIP 后，在应用里安装并选择本地目标，再到系统背屏设置中重新应用。">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b8f72'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap bar">
      <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">桥</span><span class="brand-text"><span class="brand-name">背屏卡片桥</span><span class="brand-sub">模块目录</span></span></a>
      <nav aria-label="站点">
        <a href="https://github.com/finall1008/rear-card-modules">GitHub<span class="sr-only"> 仓库</span></a>
        <a href="https://github.com/finall1008/rear-card-modules#投稿与更新">投稿<span class="sr-only">（README）</span></a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="hero">
      <p class="eyebrow">可下载的 API 2 模块</p>
      <h1>背屏的新玩法</h1>
      <p class="lede">发现喜欢的背屏卡片，下载后在背屏卡片桥中安装。</p>
    </section>
    <section class="browser" aria-labelledby="catalog-title">
      <div class="browser-head">
        <h2 id="catalog-title">模块</h2>
        <p id="status" role="status" aria-live="polite" aria-atomic="true">正在读取模块目录…</p>
      </div>
      <div class="tools">
        <div class="search">
          <label for="q">搜索</label>
          <input id="q" type="search" name="q" placeholder="名称、作者、简介或标签" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-controls="catalog">
        </div>
        <div class="filters">
          <div class="filters-label" id="tags-label">标签</div>
          <div id="tags" class="tags" role="group" aria-labelledby="tags-label"></div>
        </div>
      </div>
      <div id="error" class="error" role="alert" hidden>
        <p class="error-title">目录没有加载成功</p>
        <p data-error-detail>加载失败，请稍后重试。</p>
        <button type="button" id="retry">重试</button>
      </div>
      <div id="catalog" class="catalog" aria-busy="true"></div>
    </section>
    <section class="install" aria-labelledby="install-title">
      <h2 id="install-title">安装说明</h2>
      <ol>
        <li>点击「下载 ZIP」保存模块。</li>
        <li>打开背屏卡片桥，使用「安装 ZIP 模块」导入文件。</li>
        <li>选择本地卡片作为替换目标，按应用提示完成写入。</li>
        <li>到系统背屏设置移除旧卡，再从原入口重新应用。</li>
      </ol>
    </section>
  </main>
  <noscript><p class="noscript">请启用 JavaScript 浏览模块。</p></noscript>
  <script src="store.js" defer></script>
</body>
</html>
